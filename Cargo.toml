[package]
name = "clipped"
version = "0.2.0"
edition = "2021"

[dependencies]
slint = { version = "1.9", default-features = true }
global-hotkey = "0.6"
tray-icon = "0.24"
muda = "0.19"
enigo = "0.6.1"
arboard = "3.6.1"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
